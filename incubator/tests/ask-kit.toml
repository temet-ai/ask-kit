id = "temet.tests"
name = "tests"
version = "0.1.0"
min_ask_kit = "0.3.0"
says = "this project's checks, run for you: do the tests pass, does it build, lint and typecheck, which tests fail and why (test name, file, line, message), is a failure new since the last run, is a test flaky, what did the last run say; for npm, pnpm, yarn, pytest, cargo, go, make and just projects"
keywords = ["tests?", "test suite", "failing tests?", "unit tests?", "pytest", "jest", "vitest", "cargo test", "go test", "npm test", "lint(er|ing)?", "eslint", "ruff", "clippy", "type ?check", "tsc", "mypy", "does it (build|compile)", "build (fails?|passes|errors?)", "flaky", "red", "green"]
route_hint = "running this project's tests, build, lint or typecheck and saying what failed is tests; why CI failed on GitHub is github; reading or changing the test code itself is code; what a past session ran is sessions"
cite = "the check and its command, the test name with `path:line`, and the run id"
instructions = "instructions.md"
state_key = "${WORKDIR}"
acts = ["checks.exec"]

[[settings]]
key = "WORKDIR"
about = "the folder whose project is checked; by default the folder the agent runs in"
detect = ["node", "-e", "process.stdout.write(process.cwd())"]

[[sources]]
kind = "module"
name = "checks"
module = "checks.mjs"
api = "api.d.ts"

[[actions]]
name = "commands"
title = "The checks this project defines"
script = "commands"
match = ['(?:what|which) (?:are|is) the (?:test|lint|build|typecheck|check)(?:s|ing)? commands?(?: (?:here|for this (?:project|repo(?:sitory)?)|in this (?:project|repo(?:sitory)?)))?', 'how do (?:i|you|we) run the (?:tests?|linter|lint|build|typecheck|checks)(?: (?:here|for this (?:project|repo(?:sitory)?)|in this (?:project|repo(?:sitory)?)))?']
expect = '"checks"'

[[actions]]
name = "last"
title = "What the last run of the checks said, without running them"
script = "last"
match = ['what (?:did|was) the last (?:test|lint|build|typecheck|check)s? (?:run )?(?:say|said|fail(?:ed)?|result)(?: on)?', 'what failed (?:in|on) the last (?:test )?run']
expect = '"runs"'
