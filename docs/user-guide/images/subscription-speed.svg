<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d">
  <title id="t">One question, three subscriptions as the investigator</title>
  <desc id="d">The same question took 23 seconds with Claude Code on haiku, 36 seconds with Codex on a ChatGPT plan and 134 seconds with Copilot CLI.</desc>
  <style>
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .cream{fill:#3A1220}.muted{fill:#8F666E}
  </style>
  <rect width="960" height="260" rx="16" fill="#FBF4EB"/>
  <text x="32" y="44" class="sans cream" font-size="20" font-weight="700">One question, three subscriptions as the investigator</text>

  <text x="32" y="96" class="sans cream" font-size="14">Claude Code (haiku)</text>
  <rect x="220" y="78" width="120" height="26" rx="5" fill="#551B2B"/>
  <text x="352" y="96" class="sans cream" font-size="14" font-weight="700">23 s</text>

  <text x="32" y="140" class="sans cream" font-size="14">Codex (ChatGPT plan)</text>
  <rect x="220" y="122" width="188" height="26" rx="5" fill="#551B2B"/>
  <text x="420" y="140" class="sans cream" font-size="14" font-weight="700">36 s</text>

  <text x="32" y="184" class="sans cream" font-size="14">Copilot CLI</text>
  <rect x="220" y="166" width="660" height="26" rx="5" fill="#551B2B"/>
  <text x="892" y="184" class="sans cream" font-size="14" font-weight="700">134 s</text>

  <text x="32" y="232" class="sans muted" font-size="12">Measured 18 Nov 2026 on one machine: "which Copilot session did a piece of work, under which ticket". With an API key, comparable questions took 16–53 s.</text>
</svg>
