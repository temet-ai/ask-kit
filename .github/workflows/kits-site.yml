name: kits-site

# The kits page (site/) on GitHub Pages: kits.json is rebuilt from the GitHub topic ask-kit every
# six hours, on a push that changes the site, and by hand.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["site/**", "src/gallery.mjs", ".github/workflows/kits-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kits-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --omit=optional
      - run: node site/build-index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p _site && cp site/index.html site/kits.json site/ask-kit-logo.png _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
