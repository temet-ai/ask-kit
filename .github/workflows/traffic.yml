name: traffic

# GitHub keeps traffic for 14 days. This saves views, clones, referrers, paths and stars once a
# day to the `stats` branch (scripts/archive-traffic.mjs). Reading traffic needs a token with
# read access to the repository's administration: a fine-grained token for temet-ai/ask-kit
# with "Administration: Read-only", stored as the TRAFFIC_TOKEN secret. Without it the job
# says so and stops.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then echo "::notice::TRAFFIC_TOKEN is not set; nothing archived"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 26.x
      - name: Archive
        if: steps.token.outputs.ok == 'true'
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin stats >/dev/null; then
            git fetch --depth 1 origin stats
            git worktree add stats-tree FETCH_HEAD
          else
            git worktree add --detach stats-tree
            git -C stats-tree checkout --orphan stats
            git -C stats-tree rm -rqf .
          fi
          node scripts/archive-traffic.mjs stats-tree
          cd stats-tree
          git add -A
          git diff --cached --quiet || git commit -qm "traffic $(date -u +%F)"
          git push origin HEAD:stats
