name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node test/fixtures.mjs
      - run: node test/setup.mjs
      - run: node test/repl.mjs
      - name: bundle
        if: hashFiles('test/bundle.mjs') != ''
        run: node test/bundle.mjs
      - run: node test/plugin.mjs
