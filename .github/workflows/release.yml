name: release

# Pushing a tag vX.Y.Z publishes @temet-ai/ask-kit to npm with provenance (npm trusted
# publishing, no token), lists that version in the MCP Registry as io.github.temet-ai/ask-kit
# (GitHub OIDC, no token), and makes a GitHub release with generated notes.
# Before the first tag: CONTRIBUTING.md, "Releasing".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      - name: Check the tag and every version agree
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = require("./package.json"), server = require("./server.json"), plugin = require("./.claude-plugin/plugin.json"), gemini = require("./gemini-extension.json");
            const bad = [];
            if (pkg.private) bad.push("package.json has private: true");
            if (pkg.name !== server.packages[0].identifier) bad.push(`package.json name ${pkg.name} is not server.json identifier ${server.packages[0].identifier}`);
            for (const [what, v] of [["package.json", pkg.version], ["server.json", server.version], ["server.json package", server.packages[0].version], ["plugin.json", plugin.version], ["gemini-extension.json", gemini.version]])
              if (v !== tag) bad.push(`${what} version ${v} is not the tag ${tag}`);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '

      - run: npm publish --access public --provenance

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
